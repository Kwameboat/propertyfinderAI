<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PropertyFinder Gh — Agent PIN</title>
  <link rel="stylesheet" href="/rent.css" />
  <style>
    body { margin: 0; background: #fff8f6; color: #1a1212; font-family: Inter, system-ui, sans-serif; }
    .wrap { max-width: 28rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-size: 1.4rem; margin: 0.5rem 0 0.25rem; }
    .muted { color: #7a6666; line-height: 1.45; }
    label { display: block; margin: 1rem 0 0.35rem; font-size: 0.9rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.75rem; border-radius: 10px; border: 1px solid #edd5d5; background: #fff; color: #1a1212; font-size: 1rem; }
    button { margin-top: 1.25rem; width: 100%; color: #fff; }
    .ok { color: #0f766e; }
    .err { color: #d80008; }
    a { color: #d80008; }
  </style>
</head>
<body class="market-gh">
  <div class="wrap">
    <img src="/fie-ai-logo.webp" alt="PropertyFinder Gh" style="width:auto;max-width:160px;max-height:160px;border-radius:16px;background:#fff" />
    <p class="muted">PropertyFinder Gh</p>
    <h1>Confirm a viewing</h1>
    <p class="muted">Client gives you the 6-digit PIN at the property. Enter it with your MoMo number. We then mark GH₵50 ready to pay you.</p>
    <form id="f">
      <label>Viewing PIN
        <input name="pin" inputmode="numeric" maxlength="6" required placeholder="482910" />
      </label>
      <label>Your MoMo number
        <input name="momo" inputmode="tel" required placeholder="0241234567" />
      </label>
      <button type="submit" class="gold-btn">Confirm PIN</button>
    </form>
    <p id="msg" class="muted"></p>
    <p><a href="/">Back to PropertyFinder Gh</a></p>
  </div>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const fd = new FormData(e.target);
      msg.textContent = "Checking…";
      msg.className = "muted";
      try {
        const res = await fetch("/api/rent/viewing/redeem-pin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: String(fd.get("pin") || "").trim(), momo: String(fd.get("momo") || "").trim() })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Could not redeem PIN");
        msg.className = "ok";
        msg.textContent = "PIN confirmed. GH₵50 for this viewing is ready to pay to your MoMo.";
      } catch (err) {
        msg.className = "err";
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
