<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JAB Hub — Agent login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <p class="eyebrow">JAB Hub</p>
    <h1>Sales agent login</h1>
    <p class="muted">See leads assigned to you and reply on the client’s WhatsApp number.</p>
    <form id="login-form" class="stack">
      <label>Username<input name="login" autocomplete="username" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
    <p class="muted small"><a href="/login" style="color: var(--accent-2)">Agency login</a></p>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById("login-error");
      err.hidden = true;
      const res = await fetch("/api/agent/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login: fd.get("login"), password: fd.get("password") })
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.error || "Login failed";
        err.hidden = false;
        return;
      }
      location.href = "/agent.html";
    });
  </script>
</body>
</html>
