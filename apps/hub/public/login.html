<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JAB Hub — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <p class="eyebrow">JAB HUB</p>
    <h1>Agency login</h1>
    <p class="muted">Manage per-client contacts and WhatsApp campaigns.</p>
    <form id="login-form">
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
    <p class="muted small"><a href="/agent-login">Sales agent login</a></p>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = new FormData(e.target).get("password");
      const err = document.getElementById("login-error");
      err.hidden = true;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.error || "Login failed";
        err.hidden = false;
        return;
      }
      location.href = "/";
    });
  </script>
</body>
</html>
